# launcher が guard_shared_home_alias() の条件を満たし、かつホストの $HOME が /home/node でない
# ときだけ追加する固定設定（claude-container#99）。SHARED_MOUNT の実体を、ホストと同じ絶対パス
# （例 /home/<host user>/obsidian-vault）にも :ro で見せる。/shared（compose.yml、rw）は変えない
# ので、この :ro は境界ではなく「書き込みは /shared 経由」の目印に留まる。
# source は launcher が実体解決して export した SHARED_MOUNT、target はホストでの綴り（symlink
# 未解決）を launcher が export する。${VAR:?} は export 漏れを config 段階で失敗させる保険で、
# 保護の本体は launcher 側の無条件 export と unset にある。
services:
  claude-auth-workspace:
    volumes:
      - type: bind
        source: ${SHARED_MOUNT:?launcher が export する}
        target: ${CLAUDE_SHARED_HOST_PATH:?launcher が export する}
        read_only: true
        bind:
          create_host_path: false
