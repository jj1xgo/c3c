services:
  # 認証情報とワークスペースをマウントするサービス
  claude-auth-workspace:
    build:
      context: ${BUILD_CONTEXT_DIR}
      dockerfile: ${CLAUDE_CONTAINER_DIR}/Dockerfile.claude
      args:
        TZ: ${TZ:-UTC}
        CACHEBUST: ${CACHEBUST:-unknown}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
        CODEX_CACHEBUST: ${CODEX_CACHEBUST:-pinned}
        ASSET_HASH: ${ASSET_HASH:-unknown}
        BASE_IMAGE: ${BASE_IMAGE:-debian:stable}
        CC_PROJECT_METADATA: ${CC_PROJECT_METADATA:-}
        CC_PROJECT_PATH: ${CC_PROJECT_PATH:-}
        CC_PROJECT_NAME: ${CC_PROJECT_NAME:-}
    stdin_open: true
    tty: true
    userns_mode: keep-id
    # init-firewall.sh がコンテナ内 netns に iptables ルールを引くのに必要。
    # rootless podman + userns_mode: keep-id では、これらが非rootユーザー(node)の
    # ambient set にも入り全子プロセスへ継承されるため、Dockerfile.claude の
    # ENTRYPOINT（setpriv によるambient/inheritable剥奪）とセットで初めて
    # 「iptablesの実消費者はsudo経由のroot(init-firewall.sh)のみ」という設計が成立する。
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # IPv6 をカーネルレベルで無効化。podman のデフォルトブリッジは IPv6 グローバル
    # ルートを持たないが、glibc getaddrinfo(AI_ADDRCONFIG) はリンクローカルアドレス
    # (fe80::) の存在だけで「IPv6利用可能」と誤認し AAAA を優先するため、Happy
    # Eyeballs が到達不能な IPv6 候補への接続を試みて間欠的に失敗する（2026-07 に
    # 実障害として確認）。許可リストは A レコードのみ対象で IPv6 は元々不要なため、
    # そもそも候補に挙げさせない。init-firewall.sh の ip6tables DROP は後段の保険。
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
      net.ipv6.conf.default.disable_ipv6: 1
    #profiles:
    # 要確認（無効化されたままの下書き）
    #- auth-workspace
    environment:
      TZ: ${TZ:-UTC}
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CONTAINER_NO_FIREWALL: ${CLAUDE_CONTAINER_NO_FIREWALL:-}
      # mode と sysctls/network の不一致を避ける。IPv6用overrideが固定値1へ変える。
      CLAUDE_CONTAINER_IPV6: "0"
      # 起動する CLI（c3c 第1段階）。launcher が CLI 引数から導出して明示 export する値だけを渡す
      # （.c3c/env の許可リスト外）。entrypoint.sh が enum を再検証する。
      # CC_CODEX_START_MODE の既定は run（検査用は compose.codex-preflight.yml を選んだ launcher が
      # preflight を明示する）。既定は「未設定のときだけ」（`${VAR-default}`）。`:-` だと明示した空文字が
      # 既定値に化け、entrypoint の空文字拒否に届かない（計画: 未設定のみ既定、空文字を含む不正値は拒否）。
      CC_AGENT: ${CC_AGENT-claude}
      CC_CODEX_START_MODE: ${CC_CODEX_START_MODE-run}
      CC_CODEX_READ_ONLY: ${CC_CODEX_READ_ONLY-0}
    volumes:
      - ${CLAUDE_CONFIG_DIR:-~}/.claude.json:/home/node/.claude.json
      - ${CLAUDE_CONFIG_DIR:-~}/.claude:/home/node/.claude
      # ホストの ~/.claude のうち「ホスト側で実行・読込される user scope の設定」を、
      # 上の rw マウントの内側に :ro で重ねてコンテナから書き換え不能にする。
      # 侵害されたセッションが hook/skill/plugin 等を書くと、次にホストで Claude Code
      # を起動した時点（user settings の hooks は file watcher で稼働中セッションにも）
      # ホストの権限で実行されるため。認証・transcript・memory 等の状態は rw のまま。
      # マウント先がホストに無いと podman がサブ uid 所有の実体を作って残骸になるため、
      # claude-container の prepare_claude_config_ro() が起動直前に空で作る。
      # 基点は親と同じ ${CLAUDE_CONFIG_DIR:-~} に固定し、別実体を指せないようにする。
      # 項目を増減するときは claude-container 側の一覧と test-build.sh を同期すること。
      - ${CLAUDE_CONFIG_DIR:-~}/.claude/hooks:/home/node/.claude/hooks:ro
      - ${CLAUDE_CONFIG_DIR:-~}/.claude/skills:/home/node/.claude/skills:ro
      - ${CLAUDE_CONFIG_DIR:-~}/.claude/plugins:/home/node/.claude/plugins:ro
      - ${CLAUDE_CONFIG_DIR:-~}/.claude/commands:/home/node/.claude/commands:ro
      - ${CLAUDE_CONFIG_DIR:-~}/.claude/agents:/home/node/.claude/agents:ro
      - ${CLAUDE_CONFIG_DIR:-~}/.claude/workflows:/home/node/.claude/workflows:ro
      - ${CLAUDE_CONFIG_DIR:-~}/.claude/rules:/home/node/.claude/rules:ro
      - ${CLAUDE_CONFIG_DIR:-~}/.claude/output-styles:/home/node/.claude/output-styles:ro
      # ~/.claude 自体を git リポジトリにしているホスト向け（claude-container#129）。.git/hooks と
      # .git/config（core.hooksPath 等）はホストで git を打った時点でホスト権限で実行・参照される。
      # リポジトリでないホストでも空で作って重ね、コンテナが .git を植え付ける経路を閉じる。
      - ${CLAUDE_CONFIG_DIR:-~}/.claude/.git:/home/node/.claude/.git:ro
      - ${CLAUDE_CONFIG_DIR:-~}/.claude/settings.json:/home/node/.claude/settings.json:ro
      - ${CLAUDE_CONFIG_DIR:-~}/.claude/CLAUDE.md:/home/node/.claude/CLAUDE.md:ro
      - ${CLAUDE_CONFIG_DIR:-~}/.claude/statusline.sh:/home/node/.claude/statusline.sh:ro
      - ${CONTEXT}:/workspace
      - ${EXTRA_MOUNT:-/dev/null}:/data
      # 第2の追加マウント（claude-container#46）。複数プロジェクトから同一ホスト
      # ディレクトリ（共有ノート置き場等）を固定名 /shared で参照するための opt-in。
      # EXTRA_MOUNT（/data）が既に他用途で使用中のプロジェクト向け。rw（共有ノートへの
      # 書き込みが用途のため）。未設定時は /dev/null（EXTRA_MOUNT と同じオプトインパターン）。
      - ${SHARED_MOUNT:-/dev/null}:/shared
      # 汎用シークレットディレクトリ（任意本数・任意名のトークンをコンテナへ持ち込むための
      # opt-in マウント。SECRETS_DIR 直下は export されない、export/ サブディレクトリの
      # ファイルのみコンテナ内で環境変数として export される — entrypoint.sh 参照）。
      # 未設定時は /dev/null をマウント（EXTRA_MOUNT と同じオプトインパターン。ディレクトリで
      # なく /dev/null になるため entrypoint.sh 側は [ -d ] で判別する）。
      - ${SECRETS_DIR:-/dev/null}:/home/node/.config/claude-container/secrets:ro
      # ホスト側 git 設定のオプトインマウント（issue #6: Author identity unknown 対策）。
      # bind 元は launcher の guard_gitconfig_file() が C3C_GITCONFIG_SOURCE に export する:
      # GITCONFIG_FILE 設定時はそのファイル、未設定時は同梱の空ファイル empty.gitconfig（#149。
      # /dev/null のデバイスだと Codex の sandbox 内で git が読めない）。既定値 /dev/null は
      # launcher を通さない直接展開（lint・試験）用。
      # :ro 必須 — コンテナ内から credential.helper 等を書き換えられるとホスト側
      # 任意コマンド実行につながるため。entrypoint.sh 側の処理は不要（git が直接読む）。
      - ${C3C_GITCONFIG_SOURCE:-/dev/null}:/home/node/.gitconfig:ro
      # Codex CLI の認証情報ディレクトリのオプトインマウント（内部運用issue参照）。
      # auth.json はセッション中にアクセストークンが自動リフレッシュされホストへ書き戻される
      # ため rw（:ro なし、GITCONFIG_FILE とは逆）。ホストの実 ~/.codex を直接指すと、
      # コンテナ側コードが config.toml（notify フック等）を汚染しホストで codex 起動時に
      # 任意コマンド実行につながるため、CODEX_DIR には専用ディレクトリ（例: ~/.codex-container）
      # を設定する前提（README「利用側プロジェクトの設定」節参照）。未設定時は /dev/null
      # （SECRETS_DIR と同じオプトインパターン）。entrypoint.sh 側の特別処理は不要
      # （codex CLI が直接読む、gitconfig と同型）。
      - ${CODEX_DIR:-/dev/null}:/home/node/.codex
      # MCP監査ゲートのTOFU承認記録（claude-container#28）。ホスト側 claude-container
      # スクリプトが人間の対話承認後にのみ書き込む1行ハッシュファイル。:ro必須 —
      # コンテナ内から書き換えられると次回起動の自動承認を偽装できてしまうため。
      # 未設定時は /dev/null（SECRETS_DIR と同じオプトインパターン）。
      - ${MCP_APPROVAL_FILE:-/dev/null}:/etc/claude-container/mcp-approved-hash:ro
      # Codex の起動時 MCP 審査の承認記録（c3c 第1段階）。launcher が検査用コンテナの protocol を
      # 人間に確認させた後にだけ書く JSON 1 文書。:ro 必須（コンテナ内から書き換えられると本起動の
      # verify を偽装できる）。台帳ディレクトリ全体は載せない。未設定時は /dev/null（verify は空を拒否）。
      - ${CODEX_MCP_APPROVAL_FILE:-/dev/null}:/etc/claude-container/codex-mcp-approved.json:ro
      - /etc/localtime:/etc/localtime:ro
    working_dir: /workspace
